</style></head><body><header><div class="brand"><span class="brand-icon">✦</span> BATALHA BÍBLICA</div><nav><button onclick="goHome()">Início</button><button onclick="showRules()">Como jogar</button><button onclick="openBank()">Personagens</button><button onclick="openSettings()" aria-label="Configurações">⚙</button></nav></header><main id="app" class="shell"></main><dialog id="modal"></dialog><div id="messages" role="status" aria-live="polite"></div><script>
'use strict';
const defaults={names:['Leões de Judá','Guerreiros da Fé'],duration:60,rounds:3,difficulty:'mixed',sound:true,motion:true};
const groups=[['easy','Adão, Eva, Noé, Abraão, Sara, Isaque, Jacó, José do Egito, Moisés, Arão, Josué, Sansão, Davi, Golias, Salomão, Elias, Eliseu, Jonas, Daniel, Jó, Jesus, Maria mãe de Jesus, José marido de Maria, Pedro, Paulo, Judas Iscariotes, João Batista, Lázaro, Zaqueu, Tomé, Maria Madalena, Ester, Rute, Samuel, Saul rei de Israel'],['medium','Caim, Abel, Enoque, Ló, Rebeca, Esaú, Raquel, Lia, Miriã, Calebe, Débora, Gideão, Baraque, Ana mãe de Samuel, Jônatas, Bate-Seba, Natã, Absalão, Roboão, Neemias, Esdras, Isaías, Jeremias, Ezequiel, Sadraque, Mesaque, Abede-Nego, Marta, Maria de Betânia, Nicodemos, Filipe, Estêvão, Barnabé, Timóteo, Silas, Priscila, Áquila, Cornélio, Lídia, Bartimeu'],['hard','Bezalel, Ooliabe, Otniel, Eúde, Jefté, Jael, Boaz, Eli, Hulda, Miqueias, Amós, Oseias, Joel, Habacuque, Sofonias, Ageu, Zacarias profeta, Malaquias, Obadias, Balaão, Balaque, Naamã, Geazi, Josias, Ezequias']];
const initialBank=groups.flatMap(([level,names])=>names.split(', ').map((name,i)=>({id:level+i,name,level})));
const levels={easy:'Fácil',medium:'Média',hard:'Difícil',mixed:'Misturada'};
function read(key,fallback){try{return JSON.parse(localStorage.getItem('bb-'+key))??fallback}catch{return fallback}}
let settings={...defaults,...read('settings',{})},bank=read('bank',initialBank),match=read('match',null),view='home',timer=null,feedbackTimer=null,countTimer=null,deadline=0,busy=false,lastAction=0,baseline=null,latestPose=null,armed=false,neutralSince=0,sensorSeen=false,audio=null,screenVersion=0;
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(key,value){try{localStorage.setItem('bb-'+key,JSON.stringify(value))}catch{toast('Armazenamento indisponível. Mantenha esta página aberta.')}}
function persist(){if(match)save('match',match)}
function toast(s){$('messages').innerHTML='<div class="toast">'+esc(s)+'</div>';setTimeout(()=>$('messages').innerHTML='',4500)}
function page(html,v){view=v;screenVersion++;$('app').innerHTML=html;window.scrollTo(0,0)}
function btn(text,action,cls=''){return `<button class="${cls}" onclick="${action}">${text}</button>`}
function modal(html){$('modal').innerHTML=html;$('modal').showModal()}
function ask(title,text,action){modal(`<h2>${title}</h2><p>${text}</p><div class="actions">${btn('Cancelar',"$('modal').close()")}${btn('Confirmar',"$('modal').close();"+action,'primary')}</div>`)}
function home(){page(`<section class="hero"><div><div class="badge">O DESAFIO DA SUA EBD COMEÇA AQUI</div><h1>QUEM<br>SOU <span>EU?</span></h1><div class="subtitle">BATALHA BÍBLICA</div><p class="intro">Um celular na testa. Muitas histórias para lembrar.<br>Duas equipes e uma batalha de conhecimento.</p><div class="cta">${btn('Começar a jogar <span aria-hidden="true">→</span>','configure()','primary')}${btn('▷ &nbsp; Como jogar','showRules()')}</div>${match?`<div class="actions">${btn('↻ Continuar partida salva','resume()')}</div>`:''}<div class="micro">2 EQUIPES &nbsp; · &nbsp; ${bank.length} PERSONAGENS &nbsp; · &nbsp; INFINITAS DESCOBERTAS</div></div><div class="visual" aria-hidden="true"><div class="orbit"></div><span class="tiny-star">✧</span><div class="playing-card"><div class="cardtop"><span>QUEM SOU EU?</span><span>✦</span></div><div class="cardname">MOISÉS</div><div class="cardbottom">UMA HISTÓRIA. MUITAS PISTAS.</div></div><div class="float-label"><b>✓</b><span>Boa! A equipe acertou.<br><small class="muted">Mais um ponto nessa batalha.</small></span><b class="gold">+1</b></div></div></section><section class="features"><div class="feature"><span class="feature-icon">⚔</span><div><b>A disputa é em equipe</b><small>Duas equipes. Uma grande batalha.</small></div></div><div class="feature"><span class="feature-icon">◷</span><div><b>Cada segundo conta</b><small>Descubra o máximo antes do tempo acabar.</small></div></div><div class="feature"><span class="feature-icon">▱</span><div><b>Incline. Acerte. Comemore.</b><small>Jogue com movimentos ou pelos botões.</small></div></div></section><div class="section-label"><h2>É simples entrar na batalha.</h2><span>CONHECIMENTO + TRABALHO EM EQUIPE</span></div><section class="steps"><div class="step"><span class="num">01</span><div><b>Reúna suas equipes</b><p>Escolha os nomes e personalize o desafio.</p></div></div><div class="step"><span class="num">02</span><div><b>Celular na testa, valendo!</b><p>Ouça as dicas sem olhar function showRules(){modal(`<div class="eyebrow">ANTES DA BATALHA</div><h2>As pistas fazem o jogo.</h2><p>Dividam-se em duas equipes. Na sua vez, coloque o celular na testa com a tela para os colegas.</p><p>Os colegas dão dicas de histórias e acontecimentos bíblicos. <b>Não vale dizer, soletrar ou falar partes do nome.</b></p><p><span style="color:var(--green)">↓ Para baixo: acertou, +1 ponto.</span><br><span style="color:var(--red)">↑ Para cima: pulou, sem pontos.</span><br>Volte à posição inicial entre os movimentos. Os botões funcionam em todas as rodadas.</p><p>As equipes alternam turnos de mesma duração. Cada personagem aparece uma vez na partida. No modo misturado, a ordem de dificuldades é igual para as equipes. Se o banco acabar, a partida termina com o placar atual.</p>${btn('Entendi, vamos jogar',"$('modal').close()",'primary')}`)}
function goHome(){if(match&&view!=='home')ask('Voltar ao início?','Seu progresso será salvo para continuar depois.','pauseGame();home()');else home()}
function openSettings(){if(match&&view!=='home')return toast('Finalize a partida ou volte ao início para configurar a próxima.');configure()}
function configure(){page(`<div class="page"><div class="eyebrow">PREPARE SUA BATALHA</div><h2>Cada equipe tem sua história.</h2><p>Escolha os times, ajuste o desafio e reúna a turma.</p><form id="config"><div class="panel"><div class="grid2"><div><label for="name0">EQUIPE 1 · ROXO</label><input id="name0" name="name0" maxlength="36" required value="${esc(settings.names[0])}"></div><div><label for="name1">EQUIPE 2 · DOURADO</label><input id="name1" name="name1" maxlength="36" required value="${esc(settings.names[1])}"></div></div><fieldset><legend>DURAÇÃO DE CADA TURNO</legend><div class="choices">${[30,45,60,90,120].map(n=>btn(n+' s',`choose('duration',${n},this)`,settings.duration===n?'active':'')).join('')}</div></fieldset><fieldset><legend>RODADAS POR EQUIPE</legend><div class="choices">${[1,2,3,5].map(n=>btn(n,`choose('rounds',${n},this)`,settings.rounds===n?'active':'')).join('')}</div></fieldset><fieldset><legend>DIFICULDADE</legend><div class="choices">${Object.entries(levels).map(([k,v])=>btn(v,`choose('difficulty','${k}',this)`,settings.difficulty===k?'active':'')).join('')}</div></fieldset><div class="toggle"><label for="sound">Efeitos sonoros</label><input type="checkbox" id="sound" ${settings.sound?'checked':''}></div><div class="toggle"><label for="motion">Movimentos do celular <small class="muted">· com calibração</small></label><input type="checkbox" id="motion" ${settings.motion?'checked':''}></div><p class="notice">Os nomes não se repetem. Se o banco acabar, a partida termina. Os controles manuais estão sempre disponíveis.</p></div><div class="actions">${btn('Voltar','home()')}<button class="primary" type="submit">Entrar na batalha →</button></div></form></div>`,'config');document.querySelectorAll('#config button:not([type])').forEach(b=>b.type='button');$('config').onsubmit=e=>{e.preventDefault();settings.names=[$('name0').value.trim()||defaults.names[0],$('name1').value.trim()||defaults.names[1]];settings.sound=$('sound').checked;settings.motion=$('motion').checked;save('settings',settings);if(match)ask('Iniciar nova partida?','A partida salva será substituída.','newMatch()');else newMatch()}}
function choose(key,value,el){settings[key]=value;el.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('active'));el.classList.add('active')}
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function makeDeck(){if(settings.difficulty!=='mixed')return shuffle(bank.filter(c=>c.level===settings.difficulty));let buckets=['easy','medium','hard'].map(l=>shuffle(bank.filter(c=>c.level===l))),deck=[];while(buckets.some(b=>b.length>=2)){for(const b of buckets){if(b.length>=2)deck.push(b.pop(),b.pop())}}return deck.concat(shuffle(buckets.flat()))}
function newMatch(){const deck=makeDeck();if(!deck.length)return toast('Adicione personagens nessa dificuldade antes de jogar.');match={config:structuredClone(settings),decks:[deck.filter((_,i)=>i%2===0),deck.filter((_,i)=>i%2===1)],scores:[0,0],turn:0,total:settings.rounds*2,rounds:[],phase:'prepare',current:null,remaining:settings.duration,records:[],exhausted:false};persist();prepare()}
function prepare(){stopTimers();baseline=null;armed=false;match.phase='prepare';persist();const t=match.turn%2;page(`<div class="page center"><div class="eyebrow">${match.turn>=match.config.rounds*2?'DESEMPATE':'RODADA '+(Math.floor(match.turn/2)+1)+' DE '+match.config.rounds}</div><div class="team-bubble">${t===0?'♜':'⚔'}</div><h2>Vez de ${esc(match.config.names[t])}!</h2><p>Passe o celular para esta equipe.<br>Coloque-o na testa, com a tela para os colegas.</p><div class="hint-box">${match.config.motion?'Ao tocar em “Estou pronto”, mantenha o celular parado na testa durante a contagem. Essa será a posição neutra.':'Controles manuais ativados. Um colega pode tocar em Acertou ou Pular.'}<br>Use na horizontal para deixar o nome ainda maior.</div><p id="sensorstatus" class="notice"></p><div class="actions">${btn('Estou pronto →','ready()','primary')}${btn('Placar','scoreboard(false)')}</div></div>`,'prepare')}
async function initAudio(){try{audio??=new(window.AudioContext||window.webkitAudioContext)();await audio.resume()}catch{}}
function tone(type){if(!(match?.config.sound??settings.sound)||!audio)return;const notes=type==='correct'?[523,659,784]:type==='skip'?[280,190]:type==='win'?[523,659,784,1047]:type==='end'?[440,330,220]:[700];notes.forEach((n,i)=>{const o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.frequency.value=n;g.gain.setValueAtTime(.06,audio.currentTime+i*.11);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+i*.11+.15);o.start(audio.currentTime+i*.11);o.stop(audio.currentTime+i*.11+.16)})}
async function sensorPermission(){sensorSeen=false;latestPose=null;if(!match.config.motion)return;if(!window.isSecureContext||!window.DeviceOrientationEvent){toast('Sensores indisponíveis. Use os botões Acertou e Pular.');return}try{if(typeof DeviceOrientationEvent.requestPermission==='function'){const r=await DeviceOrientationEvent.requestPermission();if(r!=='granted')throw Error('denied')}window.addEventListener('deviceorientation',orientation)}catch{toast('Permissão de sensores negada. Os botões continuam funcionando.')}}
async function fullscreen(){try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch{toast('Tela cheia indisponível neste navegador.')}}
async function ready(){if(view!=='prepare')return;view='starting';initAudio();sensorPermission();if(document.documentElement.requestFullscreen&&!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});try{navigator.wakeLock?.request('screen').then(l=>{window.wake=l}).catch(()=>{})}catch{}countdown(false)}
function countdown(recover){stopTimers();let n=3;match.phase='countdown';persist();page(`<div class="page center"><div class="eyebrow">${esc(match.config.names[match.turn%2])}</div><h2>Celular na testa!</h2><div class="count" id="count">3</div><p>Mantenha a posição. A batalha vai começar.</p></div>`,'countdown');tone('tick');countTimer=setInterval(()=>{n--;if(n>0){$('count').textContent=n;tone('tick')}else{clearInterval(countTimer);$('count').textContent='VAI!';$('count').style.fontSize='95px';baseline=latestPose;armed=!!baseline;neutralSince=Date.now();setTimeout(()=>{if(view==='countdown')startTurn(recover)},450)}},1000)}
function pose(e){if(e.beta==null||e.gamma==null)return null;const b=e.beta*Math.PI/180,g=e.gamma*Math.PI/180;const z=Math.cos(b)*Math.cos(g);return {y:Math.sqrt(Math.max(0,1-z*z)),z}}
function orientation(e){const p=pose(e);if(!p)return;sensorSeen=true;latestPose=p;if(view!=='game'||!match?.config.motion||!baseline)return;const dot=baseline.y*p.y+baseline.z*p.z,cross=baseline.y*p.z-baseline.z*p.y;const delta=Math.atan2(cross,dot)*180/Math.PI;if(Math.abs(delta)<14){if(!neutralSince)neutralSince=Date.now();if(Date.now()-neutralSince>200)armed=true}else{neutralSince=0;if(armed&&!busy&&Math.abs(delta)>32){armed=false;act(delta<0?'correct':'skip')}}}
function draw(){const t=match.turn%2;const card=match.current;page(`<div class="game"><div class="gamehead"><span>${esc(match.config.names[t])} <span class="muted">· ${Math.floor(match.turn/2)+1}ª rodada</span></span><span class="timer" id="timer">${Math.ceil(match.remaining)}s</span><div><b class="gold" id="points">${match.records.filter(r=>r.result==='correct').length} pts</b><button onclick="toggleSound()" id="mute" aria-label="Ativar ou desativar som">${match.config.sound?'♪':'∅'}</button><button onclick="pauseGame();pauseScreen()" aria-label="Pausar">Ⅱ</button><button onclick="fullscreen()" aria-label="Tela cheia">⛶</button></div></div><div><div class="gamehint">QUEM SOU EU?</div><div class="character" id="character">${esc(card?.name||'')}</div></div><div><div class="gamehint" id="motionHint">${match.config.motion&&baseline?'↓ ACERTOU · VOLTE AO NEUTRO · ↑ PULOU':'USE OS BOTÕES PARA ACERTAR OU PULAR'}</div><div class="gamebuttons">${btn('↑ &nbsp; Pular','act(\'skip\')','skipbtn')}${btn('↓ &nbsp; Acertou +1','act(\'correct\')','correct')}</div></div></div>`,'game')}
function nextCard(){match.current=match.decks[match.turn%2].shift()||null;persist();return !!match.current}
function startTurn(recover=false){if(!recover){match.records=[];match.remaining=match.config.duration;nextCard()}if(!match.current){match.phase='playing';match.exhausted=true;return finishTurn('bank')}busy=false;lastAction=Date.now();match.phase='playing';deadline=Date.now()+match.remaining*1000;persist();draw();if(match.config.motion&&!baseline)toast('Não foi possível calibrar os sensores. Use os botões ou pause para recalibrar.');let prev=Math.ceil(match.remaining);timer=setInterval(()=>{match.remaining=Math.max(0,(deadline-Date.now())/1000);const n=Math.ceil(match.remaining);if($('timer')){$('timer').textContent=n+'s';$('timer').classList.toggle('urgent',n<=10)}if(n!==prev){if(n<=10&&n>0)tone('tick');prev=n;persist()}if(match.remaining<=0)finishTurn('time')},80)}
function act(result){if(view!=='game'||busy||Date.now()-lastAction<700)return;if(Date.now()>=deadline)return finishTurn('time');busy=true;lastAction=Date.now();const t=match.turn%2;match.records.push({...match.current,result});if(result==='correct')match.scores[t]++;tone(result);try{navigator.vibrate?.(result==='correct'?[70]:[40,40,40])}catch{}match.remaining=Math.max(0,(deadline-Date.now())/1000);match.current=null;const has=nextCard();persist();const el=document.createElement('div');el.className='feedback'+(result==='skip'?' red':'');el.textContent=result==='correct'?'ACERTOU! +1':'PULOU!';document.body.append(el);feedbackTimer=setTimeout(()=>{el.remove();busy=false;if(view!=='game')return;if(!has){match.exhausted=true;finishTurn('bank')}else{$('character').textContent=match.current.name;$('points').textContent=match.records.filter(r=>r.result==='correct').length+' pts'}},650)}
function stopTimers(){clearInterval(timer);clearInterval(countTimer);clearTimeout(feedbackTimer);document.querySelectorAll('.feedback').forEach(e=>e.remove());busy=false}
function pauseGame(){if(!match)return;if(match.phase==='playing'){match.remaining=Math.max(0,(deadline-Date.now())/1000);match.phase='paused'}else if(match.phase==='countdown')match.phase='prepare';stopTimers();persist()}
function pauseScreen(){page(`<div class="page center"><div class="team-bubble">Ⅱ</div><h2>Batalha pausada</h2><p>O tempo está guardado. Reposicione o celular para continuar.</p><div class="actions">${btn('Continuar e recalibrar','resumePlaying()','primary')}${btn('Reiniciar partida',"ask('Reiniciar partida?','Todos os pontos serão zerados.','restart()')")}${btn('Voltar ao início','home()')}</div></div>`,'paused')}
function resumePlaying(){initAudio();sensorPermission();countdown(true)}
function toggleSound(){match.config.sound=!match.config.sound;persist();$('mute').textContent=match.config.sound?'♪':'∅';if(match.config.sound)initAudio()}
function finishTurn(reason){if(!match||match.phase!=='playing')return;stopTimers();tone('end');match.phase='result';match.remaining=0;match.rounds.push({team:match.turn%2,turn:match.turn,records:[...match.records],reason});if(reason==='bank')match.exhausted=true;persist();result()}
function result(){const r=match.rounds.at(-1),correct=r.records.filter(x=>x.result==='correct').length;page(`<div class="page"><div class="eyebrow">TURNO ENCERRADO</div><h2>Boa batalha, ${esc(match.config.names[r.team])}!</h2><p>${r.reason==='bank'?'Os personagens disponíveis para esta equipe acabaram. A partida será encerrada sem repetir nomes.':'Tempo encerrado. Cada descoberta conta.'}</p><div class="scoregrid"><div class="scorecard"><strong>${correct}</strong>acertos</div><div class="scorecard"><strong>${r.records.length-correct}</strong>pulos</div></div><div class="panel"><b>Total da equipe: <span class="gold">${match.scores[r.team]} pontos</span></b><ul class="history">${r.records.map(c=>`<li><span>${esc(c.name)}</span><span class="tag ${c.result==='skip'?'skip':''}">${c.result==='correct'?'Acertou +1':'Pulou'}</span></li>`).join('')||'<li>Nenhum personagem respondido.</li>'}</ul></div><p class="muted">${!match.exhausted&&match.turn+1<match.total?'A seguir: '+esc(match.config.names[(match.turn+1)%2]):'Veja o resultado da batalha.'}</p><div class="actions">${btn(match.exhausted||match.turn+1>=match.total?'Ver resultado final →':match.turn%2===0?'Passar para '+esc(match.config.names[1])+' →':'Ver placar geral →','advance()','primary')}</div></div>`,'result')}
function advance(){if(match.exhausted||match.turn+1>=match.total){match.phase='final';persist();return final()}match.turn++;match.phase='prepare';match.current=null;match.records=[];persist();if(match.turn%2===0)scoreboard(true);else prepare()}
function scoresHTML(){const sum=match.scores[0]+match.scores[1];return `<div class="scoregrid">${match.scores.map((s,i)=>`<div class="scorecard"><div style="color:${i?'var(--gold)':'var(--purple)'}">${esc(match.config.names[i])}</div><strong>${s}</strong><span class="muted">pontos</span></div>`).join('')}</div><div class="bar"><span style="width:${sum?100*match.scores[0]/sum:50}%"></span></div>`}
function scoreboard(next){page(`<div class="page"><div class="eyebrow">A BATALHA CONTINUA</div><h2>Placar geral</h2><p>Uma equipe ajuda a outra a ir mais longe.</p>${scoresHTML()}<div class="actions">${btn('Próxima equipe →','prepare()','primary')}${btn('Histórico das rodadas','showHistory()')}</div></div>`,'score')}
function showHistory(){modal(`<h2>Histórico da batalha</h2><div class="history">${match.rounds.map(r=>`<details><summary style="padding:15px 0">Rodada ${Math.floor(r.turn/2)+1} · ${esc(match.config.names[r.team])} · ${r.records.filter(x=>x.result==='correct').length} pts</summary>${r.records.map(c=>`<p>${esc(c.name)} — ${c.result==='correct'?'acertou':'pulou'}</p>`).join('')||'<p>Sem respostas.</p>'}</details>`).join('')}</div>${btn('Fechar',"$('modal').close()")}`)}
function final(){stopTimers();match.phase='final';persist();const tie=match.scores[0]===match.scores[1],winner=match.scores[0]>match.scores[1]?0:1;page(`<div class="page center"><div class="team-bubble gold">♛</div><div class="eyebrow">${tie?'O DESAFIO CONTINUA':'CAMPEÕES DA BATALHA BÍBLICA'}</div><h2>${tie?'Uma batalha empatada!':esc(match.config.names[winner])+' venceu!'}</h2><p>${match.exhausted?'O banco se esgotou. Não repetimos nenhum personagem. ':''}${tie?'As equipes terminaram com a mesma pontuação.':'Conhecimento compartilhado. Vitória conquistada em equipe.'}</p>${scoresHTML()}${tie?btn('Jogar desempate · um turno por equipe','tiebreak()','primary'):''}<div class="actions">${btn('Jogar novamente','restart()','primary')}${btn('Nova partida',"match=null;save('match',null);configure()")}${btn('Início','home()')}</div><div class="actions">${btn('Histórico completo','showHistory()')}</div></div>`,'final');if(!tie){tone('win');confetti()}}
function confetti(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;for(let i=0;i<45;i++){let d=document.createElement('i');d.className='confetti';d.style.cssText=`left:${Math.random()*100}%;width:7px;height:12px;background:${['#9270ff','#f6cc72','#51deb0'][i%3]};animation-delay:${Math.random()}s`;document.body.append(d);setTimeout(()=>d.remove(),4500)}}
function restart(){settings=structuredClone(match.config);newMatch()}
function tiebreak(){if(match.decks.some(d=>!d.length))return toast('Não há personagens suficientes para dois turnos de desempate sem repetir. Inicie uma nova partida.');match.turn++;match.total=match.turn+2;match.exhausted=false;match.current=null;match.records=[];prepare()}
function resume(){if(!match)return;switch(match.phase){case'playing':case'paused':match.phase='paused';persist();pauseScreen();break;case'result':result();break;case'final':final();break;default:prepare()}}
function openBank(){if(match&&view!=='home')return toast('Volte ao início antes de editar o banco. A partida usa uma cópia dos personagens.');page(`<div class="page"><div class="eyebrow">CADA NOME, UMA HISTÓRIA</div><h2>Banco de personagens <span class="gold">${bank.length}</span></h2><p>Personalize o desafio. Alterações ficam salvas neste navegador e valem para novas partidas.</p><div class="panel"><div class="grid2"><div><label for="search">BUSCAR PERSONAGEM</label><input id="search" placeholder="Digite um nome…" oninput="renderBank()"></div><div><label for="filter">DIFICULDADE</label><select id="filter" onchange="renderBank()"><option value="all">Todas</option>${Object.entries(levels).filter(([k])=>k!=='mixed').map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div></div><div class="actions">${btn('+ Adicionar personagem','editCharacter()','primary')}${btn('Restaurar os 100 originais',"ask('Restaurar banco?','Os personagens personalizados serão removidos.','restoreBank()')")}</div><div id="banklist" class="banklist"></div></div><div class="actions">${btn('Voltar ao início','home()')}</div></div>`,'bank');renderBank()}
function renderBank(){const q=$('search').value.toLocaleLowerCase('pt-BR'),l=$('filter').value;const list=bank.filter(c=>c.name.toLocaleLowerCase('pt-BR').includes(q)&&(l==='all'||c.level===l));$('banklist').innerHTML=list.map(c=>`<div class="bank-row"><span>${esc(c.name)}<small>${levels[c.level]}</small></span>${btn('Editar',`editCharacter('${c.id}')`)}${btn('Excluir',`removeCharacter('${c.id}')`)}</div>`).join('')||'<p class="muted">Nenhum personagem encontrado.</p>'}
function editCharacter(id){const c=bank.find(c=>c.id===id);modal(`<h2>${c?'Editar':'Novo'} personagem</h2><form id="characterForm"><label for="charName">NOME</label><input id="charName" maxlength="60" required value="${esc(c?.name||'')}"><label for="charLevel" style="margin-top:20px">DIFICULDADE</label><select id="charLevel">${['easy','medium','hard'].map(l=>`<option value="${l}" ${c?.level===l?'selected':''}>${levels[l]}</option>`).join('')}</select><p id="charError" class="notice" role="alert"></p><div class="actions">${btn('Cancelar',"$('modal').close()") }<button type="submit" class="primary">Salvar personagem</button></div></form>`);$('characterForm').querySelector('button').type='button';$('characterForm').onsubmit=e=>{e.preventDefault();let name=$('charName').value.trim();if(!name)return;if(bank.some(x=>x.id!==id&&x.name.localeCompare(name,'pt-BR',{sensitivity:'base'})===0)){$('charError').textContent='Esse personagem já está no banco.';return}if(c){c.name=name;c.level=$('charLevel').value}else bank.push({id:crypto.randomUUID(),name,level:$('charLevel').value});save('bank',bank);$('modal').close();openBank()}}
function removeCharacter(id){const c=bank.find(c=>c.id===id);ask('Excluir personagem?',esc(c.name)+' será removido do banco.',`deleteCharacter('${id}')`)}
function deleteCharacter(id){bank=bank.filter(c=>c.id!==id);save('bank',bank);openBank()}
function restoreBank(){bank=structuredClone(initialBank);save('bank',bank);openBank()}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&(view==='game'||view==='countdown')){pauseGame();pauseScreen()}});
window.addEventListener('beforeunload',e=>{if(view==='game'||view==='countdown'){pauseGame();e.preventDefault();e.returnValue=''}});
window.addEventListener('pagehide',()=>{if(match?.phase==='playing')pauseGame()});
if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').then(()=>{navigator.serviceWorker.addEventListener('message',e=>{if(e.data==='offline-ready')toast('Jogo pronto para uso offline neste navegador.')})}).catch(()=>{});
home();
</script></body></html>
