<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="theme-color" content="#060b1a"/>
<title>Panini FIFA WC 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#060b1a;color:#e2e8f0;font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;padding-bottom:40px;}
@keyframes slideIn{from{opacity:0;transform:translateY(20px) scale(0.92);}to{opacity:1;transform:translateY(0) scale(1);}}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.6;}}
::-webkit-scrollbar{width:6px;}
::-webkit-scrollbar-track{background:#0a0f1e;}
::-webkit-scrollbar-thumb{background:#1e3a6e;border-radius:3px;}
#app{max-width:480px;margin:0 auto;}
.header{background:linear-gradient(135deg,#0d1b3e 0%,#1a2f6e 50%,#0d1b3e 100%);border-bottom:2px solid #1e3a6e;padding:16px 20px 12px;position:sticky;top:0;z-index:100;box-shadow:0 4px 24px #00000088;}
.title{text-align:center;font-size:26px;font-weight:900;letter-spacing:2px;font-family:'Bebas Neue',sans-serif;color:#fff;text-shadow:0 0 20px #3b82f688;}
.subtitle{text-align:center;font-size:11px;color:#64748b;letter-spacing:3px;margin-top:2px;}
.progress-bar-bg{background:#1e293b;border-radius:999px;height:6px;overflow:hidden;margin-bottom:4px;}
.progress-bar-fill{background:linear-gradient(90deg,#3b82f6,#8b5cf6);height:100%;border-radius:999px;transition:width .5s ease;}
.stats{display:flex;gap:8px;margin:10px 0;}
.stat-box{flex:1;background:#0f1a33;border-radius:8px;padding:6px 4px;text-align:center;border:1px solid #1e3a6e;}
.stat-icon{font-size:14px;}
.stat-val{font-size:15px;font-weight:800;font-family:'Bebas Neue',sans-serif;}
.stat-label{font-size:9px;color:#64748b;}
.tabs{display:flex;gap:8px;}
.tab{flex:1;padding:8px;border-radius:8px;border:none;cursor:pointer;font-weight:700;font-size:12px;letter-spacing:1px;font-family:'Rajdhani',sans-serif;transition:all .2s;}
.tab.active{background:#3b82f6;color:#fff;}
.tab.inactive{background:#1e293b;color:#64748b;}
.content{padding:16px;}
.card-box{background:#0f1a33;border-radius:12px;padding:14px;border:1px solid #1e3a6e;margin-bottom:16px;}
.section-label{font-size:11px;color:#64748b;margin-bottom:8px;letter-spacing:1px;}
.qty-row{display:flex;gap:8px;align-items:center;margin-bottom:10px;}
.qty-input{width:100%;padding:8px 10px;border-radius:8px;background:#1e293b;border:1px solid #2d4a7a;color:#e2e8f0;font-size:16px;font-weight:700;}
.qty-btns{display:flex;flex-direction:column;gap:4px;padding-top:16px;}
.qty-btn{padding:4px 10px;border-radius:6px;border:none;cursor:pointer;font-size:11px;font-weight:700;}
.open-btn{width:100%;padding:14px;border-radius:10px;border:none;cursor:pointer;color:#fff;font-weight:900;font-size:16px;letter-spacing:2px;font-family:'Bebas Neue',sans-serif;transition:transform .1s;}
.open-btn.active{background:linear-gradient(135deg,#2563eb 0%,#7c3aed 100%);box-shadow:0 4px 20px #3b82f644;}
.open-btn.disabled{background:#1e293b;cursor:not-allowed;}
.open-btn.opening{animation:pulse .6s infinite;}
.pack-label{font-size:11px;color:#64748b;margin-bottom:10px;letter-spacing:2px;}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
.sticker-card{border-radius:12px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;min-height:110px;justify-content:center;}
.sticker-new-badge{position:absolute;top:-8px;right:-8px;background:#ef4444;color:#fff;font-size:9px;font-weight:700;border-radius:999px;padding:2px 6px;letter-spacing:.5px;}
.sticker-icon{font-size:22px;}
.sticker-name{font-size:11px;font-weight:700;text-align:center;line-height:1.2;font-family:'Bebas Neue','Anton',sans-serif;letter-spacing:.5px;}
.sticker-team{font-size:9px;color:#94a3b8;text-align:center;font-family:monospace;}
.sticker-rarity{margin-top:2px;font-size:9px;font-weight:700;opacity:.8;border-radius:4px;padding:1px 6px;letter-spacing:.5px;}
.sticker-id{font-size:8px;color:#475569;}
.sticker-page{font-size:9px;color:#64748b;background:#0f1729;border-radius:4px;padding:1px 6px;margin-top:1px;letter-spacing:.5px;}
.see-more-btn{width:100%;padding:10px;border-radius:8px;border:1px solid #1e3a6e;background:#0f1a33;color:#60a5fa;cursor:pointer;font-size:12px;font-weight:700;margin-bottom:12px;}
.filter-box{background:#0f1a33;border-radius:12px;padding:12px;border:1px solid #1e3a6e;margin-bottom:14px;}
.filter-select{width:100%;padding:8px;border-radius:8px;background:#1e293b;border:1px solid #2d4a7a;color:#e2e8f0;font-size:13px;margin-bottom:8px;}
.empty-msg{text-align:center;color:#475569;padding:40px 0;font-size:14px;}
.rarity-legend{padding:20px 16px 0;margin-top:8px;}
.rarity-label-sm{font-size:10px;color:#334155;margin-bottom:8px;letter-spacing:2px;}
.rarity-tags{display:flex;flex-wrap:wrap;gap:6px;}
.rarity-tag{font-size:9px;border-radius:4px;padding:2px 7px;font-weight:700;}
.loading{display:flex;align-items:center;justify-content:center;min-height:100vh;color:#60a5fa;font-size:18px;font-family:monospace;}
</style>
</head>

  { id: 928, name: "Heungmin Son", team: "Coreia do Sul", type: "legend-dourada", variant: "Dourada" },
  { id: 929, name: "Heungmin Son", team: "Coreia do Sul", type: "legend-roxa", variant: "Roxa" },
  { id: 930, name: "Federico Valverde", team: "Uruguai", type: "legend-normal", variant: "Normal" },
  { id: 931, name: "Federico Valverde", team: "Uruguai", type: "legend-prata", variant: "Prata" },
  { id: 932, name: "Federico Valverde", team: "Uruguai", type: "legend-dourada", variant: "Dourada" },
  { id: 933, name: "Federico Valverde", team: "Uruguai", type: "legend-roxa", variant: "Roxa" },
  { id: 934, name: "Cody Gakpo", team: "Holanda", type: "legend-normal", variant: "Normal" },
  { id: 935, name: "Cody Gakpo", team: "Holanda", type: "legend-prata", variant: "Prata" },
  { id: 936, name: "Cody Gakpo", team: "Holanda", type: "legend-dourada", variant: "Dourada" },
  { id: 937, name: "Cody Gakpo", team: "Holanda", type: "legend-roxa", variant: "Roxa" },

];

// ─── RARITY
const RARITY = {
  escudo:         { weight: 3,  label: 'Escudo',           color: '#60a5fa', bg: '#1e3a5f' },
  foto:           { weight: 3,  label: 'Time',             color: '#60a5fa', bg: '#1e3a5f' },
  player:         { weight: 55, label: 'Jogador',          color: '#e2e8f0', bg: '#1a2744' },
  especial:       { weight: 8,  label: 'Especial',         color: '#fbbf24', bg: '#2d1f00' },
  museum:         { weight: 6,  label: 'Museum',           color: '#a78bfa', bg: '#1e1040' },
  acao:           { weight: 10, label: 'Ação ⚡',           color: '#34d399', bg: '#002a1a' },
  'legend-normal':{ weight: 8,  label: 'Legend',           color: '#fb923c', bg: '#2a1000' },
  'legend-prata': { weight: 4,  label: 'Legend Prata ✨',  color: '#cbd5e1', bg: '#1a1f2a' },
  'legend-dourada':{ weight: 2, label: 'Legend Dourada 🌟',color: '#fcd34d', bg: '#2a1f00' },
  'legend-roxa':  { weight: 1,  label: 'Legend Roxa 💜',   color: '#c084fc', bg: '#1a0030' },
};

const ICONS = {
  escudo:'🛡️', foto:'📸', player:'⚽', especial:'🏆', museum:'🏛️', acao:'⚡',
  'legend-normal':'🌟','legend-prata':'✨','legend-dourada':'🌟','legend-roxa':'💜',
};

// ─── STORAGE
const STORAGE_KEY = 'panini_wc2026_save';
function saveData(pulledSet, count) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ ids: [...pulledSet], count }));
  } catch(e) { console.error(e); }
}
function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return { ids: new Set(), count: 0 };
    const d = JSON.parse(raw);
    return { ids: new Set((d.ids||[]).map(Number)), count: Number(d.count)||0 };
  } catch { return { ids: new Set(), count: 0 }; }
}

// ─── WEIGHTED RANDOM
function weightedRandom(arr) {
  const total = arr.reduce((s,x) => s + (RARITY[x.type]?.weight||3), 0);
  let r = Math.random() * total;
  for (const x of arr) { r -= (RARITY[x.type]?.weight||3); if (r <= 0) return x; }
  return arr[arr.length-1];
}

// ─── STATE
let state = {
  pulled: new Set(),
  packCount: 0,
  packSize: 16,
  lastPack: [],
  showAll: false,
  view: 'pack',
  filterTeam: 'Todos',
  filterType: 'Todos',
  opening: false,
};

function init() {
  const d = loadData();
  state.pulled = d.ids;
  state.packCount = d.count;
  render();
}

// ─── RENDER
function render() {
  const app = document.getElementById('app');
  const total = ALL_STICKERS.length;
  const pulledCount = state.pulled.size;
  const progress = Math.round((pulledCount / total) * 100);
  const available = ALL_STICKERS.filter(s => !state.pulled.has(s.id));
  const pulledStickers = ALL_STICKERS.filter(s => state.pulled.has(s.id));
  const legendCount = pulledStickers.filter(s => s.type.startsWith('legend')).length;

  const teams = ['Todos', ...[...new Set(ALL_STICKERS.map(s => s.team))].sort()];
  const types = ['Todos', ...[...new Set(ALL_STICKERS.map(s => RARITY[s.type]?.label || s.type))]];
  const filteredCol = pulledStickers.filter(s => {
    const tok = state.filterTeam === 'Todos' || s.team === state.filterTeam;
    const tyk = state.filterType === 'Todos' || (RARITY[s.type]?.label||s.type) === state.filterType;
    return tok && tyk;
  });

  const displayedPack = state.showAll ? state.lastPack : state.lastPack.slice(0,16);

  app.innerHTML = `
  <div class="header">
    <div class="title">🏆 PANINI FIFA WC 2026</div>
    <div class="subtitle">SIMULADOR DE ÁLBUM</div>
    <div style="margin:10px 0 4px;display:flex;justify-content:space-between;font-size:11px;color:#94a3b8;">
      <span>${pulledCount} / ${total} figurinhas</span>
      <span style="color:${progress>=100?'#34d399':'#fbbf24'};font-weight:700">${progress}%</span>
    </div>
    <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${progress}%"></div></div>
    <div class="stats">
      ${[['📦','Pacotes',state.packCount],['🎯','Restantes',total-pulledCount],['💎','Lendas',legendCount]].map(([ic,lb,vl])=>`
        <div class="stat-box">
          <div class="stat-icon">${ic}</div>
          <div class="stat-val">${vl}</div>
          <div class="stat-label">${lb}</div>
        </div>`).join('')}
    </div>
    <div class="tabs">
      <button class="tab ${state.view==='pack'?'active':'inactive'}" onclick="setView('pack')">📦 PACOTE</button>
      <button class="tab ${state.view==='collection'?'active':'inactive'}" onclick="setView('collection')">📒 COLEÇÃO</button>
    </div>
  </div>

  <div class="content">
    ${state.view === 'pack' ? `
      <div class="card-box">
        <div class="section-label">CONFIGURAR PACOTE</div>
        <div class="qty-row">
          <div style="flex:1">
            <div style="font-size:10px;color:#94a3b8;margin-bottom:4px">Qtd. de figurinhas</div>
            <input class="qty-input" type="number" min="1" max="${Math.max(1,available.length)}" value="${state.packSize}" oninput="setPackSize(this.value)" />
          </div>
          <div class="qty-btns">
            ${[1,5,16,50].map(n=>`<button class="qty-btn" style="background:${state.packSize==n?'#3b82f6':'#1e293b'};color:${state.packSize==n?'#fff':'#64748b'}" onclick="setQty(${n})">${n}</button>`).join('')}
          </div>
        </div>
        <button class="open-btn ${available.length===0?'disabled':state.opening?'active opening':'active'}"
          onclick="openPack()" ${available.length===0||state.opening?'disabled':''}>
          ${available.length===0?'🎉 ÁLBUM COMPLETO!':state.opening?'ABRINDO...':`📦 ABRIR PACOTE (${Math.min(state.packSize,available.length)} fig.)`}
        </button>
        <button onclick="resetAlbum()" style="width:100%;margin-top:8px;padding:8px;border-radius:8px;border:1px solid #ef444433;background:transparent;color:#ef4444;cursor:pointer;font-size:11px;font-weight:600;">
          🔄 Resetar álbum
        </button>
      </div>

      ${state.lastPack.length > 0 ? `
        <div class="pack-label">ÚLTIMO PACOTE — ${state.lastPack.length} figurinhas</div>
        <div class="grid">
          ${displayedPack.map((s,i) => renderCard(s, true, i*0.04)).join('')}
        </div>
        ${state.lastPack.length > 16 && !state.showAll ? `
          <button class="see-more-btn" onclick="showMore()">Ver todas (${state.lastPack.length-16} restantes) ↓</button>
        ` : ''}
      ` : ''}
    ` : `
      <div class="filter-box">
        <div class="section-label">FILTRAR COLEÇÃO (${filteredCol.length} figurinhas)</div>
        <select class="filter-select" onchange="setFilterTeam(this.value)">
          ${teams.map(t=>`<option ${t===state.filterTeam?'selected':''}>${t}</option>`).join('')}
        </select>
        <select class="filter-select" style="margin-bottom:0" onchange="setFilterType(this.value)">
          ${types.map(t=>`<option ${t===state.filterType?'selected':''}>${t}</option>`).join('')}
        </select>
      </div>
      ${filteredCol.length === 0 ? `
        <div class="empty-msg">Nenhuma figurinha neste filtro ainda.<br/><span style="font-size:12px">Abra pacotes para preencher o álbum!</span></div>
      ` : `
        <div class="grid">${filteredCol.map(s => renderCard(s, false, 0)).join('')}</div>
      `}
    `}
  </div>

  <div class="rarity-legend">
    <div class="rarity-label-sm">RARIDADE</div>
    <div class="rarity-tags">
      ${Object.entries(RARITY).map(([k,r])=>`
        <div class="rarity-tag" style="background:${r.bg};color:${r.color};border:1px solid ${r.color}55">${r.label}</div>
      `).join('')}
    </div>
  </div>`;
}

function renderCard(s, isNew, delay) {
  const r = RARITY[s.type] || RARITY.player;
  const icon = ICONS[s.type] || '⚽';
  const isLegend = s.type.startsWith('legend');
  const shadow = isLegend ? `0 0 18px ${r.color}88` : '0 2px 8px #00000066';
  return `
    <div class="sticker-card" style="background:${r.bg};border:2px solid ${r.color};box-shadow:${shadow};animation:slideIn .4s ease ${delay}s both;">
      ${isNew ? '<div class="sticker-new-badge">NOVA</div>' : ''}
      <div class="sticker-icon">${icon}</div>
      <div class="sticker-name" style="color:${r.color}">${s.name}${s.variant?' · '+s.variant:''}</div>
      <div class="sticker-team">${s.team}</div>
      <div class="sticker-rarity" style="color:${r.color};background:${r.color}22">${r.label}</div>
      <div class="sticker-id">#${s.id}</div>
      <div class="sticker-page">📄 Pág. ${getPage(s.id)}</div>
    </div>`;
}

// ─── ACTIONS
function setView(v) { state.view = v; render(); }
function setPackSize(v) { const n=parseInt(v); if(!isNaN(n)&&n>=1) state.packSize=n; }
function setQty(n) { state.packSize = n; render(); }
function showMore() { state.showAll = true; render(); }
function setFilterTeam(v) { state.filterTeam = v; render(); }
function setFilterType(v) { state.filterType = v; render(); }

function resetAlbum() {
  if (!confirm('Tem certeza? Todo o progresso será apagado!')) return;
  state.pulled = new Set();
  state.packCount = 0;
  state.lastPack = [];
  state.showAll = false;
  saveData(state.pulled, 0);
  render();
}

function openPack() {
  if (state.opening) return;
  const avail = ALL_STICKERS.filter(s => !state.pulled.has(s.id));
  if (avail.length === 0) return;
  state.opening = true;
  render();
  setTimeout(() => {
    const count = Math.min(state.packSize, avail.length);
    const pack = [];
    const temp = [...avail];
    for (let i = 0; i < count; i++) {
      const chosen = weightedRandom(temp);
      pack.push(chosen);
      temp.splice(temp.findIndex(x => x.id === chosen.id), 1);
    }
    pack.forEach(s => state.pulled.add(s.id));
    state.lastPack = pack;
    state.packCount++;
    state.showAll = false;
    state.view = 'pack';
    state.opening = false;
    saveData(state.pulled, state.packCount);
    render();
  }, 300);
}

init();
</script>
</body>
